<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Area of a Triangle</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
	{% include '_navigation.html' %}
	<div class="container">
		<div class="card">
			<h1>Area of a Triangle</h1>

			<form action="{{ url_for('triangle') }}" method="post">
				<label for="base">Enter the base:</label>
				<input type="number" id="base" name="base" min="0" step="any" placeholder="Example: 8" required>
				<label for="height">Enter the height:</label>
				<input type="number" id="height" name="height" min="0" step="any" placeholder="Example: 5" required>
				<input type="submit" value="Compute">
			</form>

			{% if error %}
			<p class="error">{{ error }}</p>
			{% endif %}
			{% if result is not none %}
			<p class="result">Area of the triangle: {{ result }}</p>
			{% endif %}
			<p><a href="{{ url_for('works') }}">Back to Works</a></p>
		</div>
	</div>
</body>
</html>
