<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of a Circle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include '_navigation.html' %}
    <div class="container">
        <div class="card">
            <h1>Area of a Circle</h1>

            <form action="{{ url_for('circle') }}" method="post">
                <label for="radius">Enter a radius:</label>
                <input type="number" id="radius" name="radius" min="0" step="any" placeholder="Example: 7" required>
                <input type="submit" value="Compute">
            </form>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            {% if result is not none %}
            <p class="result">Area of the circle: {{ result }}</p>
            {% endif %}
            <p><a href="{{ url_for('works') }}">Back to Works</a></p>
        </div>
    </div>
</body>
</html>
